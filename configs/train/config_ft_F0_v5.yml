# ChiReSSD fine-tuning recipe — the configuration behind the released checkpoint.
#
# Paths are written as ${dotted.key} references into paths.yaml. Upstream's
# train_finetune.py reads plain YAML and cannot interpolate, so `chiressd-train`
# renders this into a concrete config before launching; that rendered file is
# kept next to the run as its provenance record.
#
# Values marked "ChiReSSD:" differ from the upstream fine-tuning config. The
# rest is upstream's, unchanged.

log_dir: "${outputs.models}/chiressd_ft_F0_v5"
save_freq: 1
log_interval: 1
device: "cuda"

# ChiReSSD: 4 epochs at batch 4. 
epochs: 4
batch_size: 4
max_len: 600                      

# StyleTTS2 LibriTTS 2nd-stage checkpoint. Not redistributed; see DATA.md.
pretrained_model: "${models.libritts_base}"
second_stage_load_pretrained: true
load_only_params: true

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
PLBERT_dir: "Utils/PLBERT/"

data_params:
  # Pipe-delimited: wav|IPA phonemes|speaker_id. Build with `chiressd-prepare`.
  train_data: "${datasets.train.train_list}"
  val_data: "${datasets.train.val_list}"
  root_path: "${datasets.train.audio}"
  OOD_data: "Data/OOD_texts.txt"   # ships with the upstream checkout
  min_length: 50

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  multispeaker: true

  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80

  n_token: 178
  max_dur: 50
  style_dim: 128

  dropout: 0.2

  decoder:
    type: "hifigan"
    resblock_kernel_sizes: [3, 7, 11]
    upsample_rates: [10, 5, 3, 2]
    upsample_initial_channel: 512
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    upsample_kernel_sizes: [20, 10, 6, 4]

  slm:
    model: "microsoft/wavlm-base-plus"
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

loss_params:
  lambda_mel: 5.
  lambda_gen: 1.
  lambda_slm: 1.

  lambda_mono: 1.
  lambda_s2s: 1.

  # The pitch extractor was pretrained on adult
  # voices, and children's F0 is both higher and more variable, so pitch needs
  # the strongest adaptation of any component.
  lambda_F0: 20.

  lambda_norm: 1.
  lambda_dur: 1.
  lambda_ce: 10.
  lambda_sty: 1.
  lambda_diff: 1.

  # Style diffusion joins after a 2-epoch warm-up,
  # the joint SLM-adversarial objective after 3, so the pretrained
  # representations are not destabilised before they re-converge.
  diff_epoch: 2
  joint_epoch: 3

optimizer_params:
  # ChiReSSD: 1e-5, a small corpus and a large
  # domain shift punish a high rate.
  lr: 0.00001
  bert_lr: 0.00001
  ft_lr: 0.00001

slmadv_params:
  min_len: 10                      # ChiReSSD: upstream 400; clinical prompts are short
  max_len: 500
  batch_percentage: 2
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
